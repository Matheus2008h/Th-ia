version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: th-ia-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: th_ia
      MYSQL_USER: thia
      MYSQL_PASSWORD: thia_password
    volumes:
      - th_ia_mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: th-ia-redis
    restart: unless-stopped
    volumes:
      - th_ia_redis_data:/data

  backend:
    build: ./backend
    container_name: th-ia-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - '4000:4000' # remova esta linha depois que o Caddy estiver funcionando, se quiser fechar de vez
    volumes:
      - th_ia_uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: th-ia-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://api.seudominio.com
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: th-ia-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

volumes:
  th_ia_mysql_data:
  th_ia_redis_data:
  th_ia_uploads:
  caddy_data:
  caddy_config:
