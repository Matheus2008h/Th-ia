[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Aponte para onde o backend estiver hospedado de verdade (Railway, Render, VPS com Docker, etc.)
# Configure isso também em Site settings > Environment variables no painel do Netlify.
[build.environment]
  NEXT_PUBLIC_API_URL = "https://seu-backend-em-outro-lugar.com"
